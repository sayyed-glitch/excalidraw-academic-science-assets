<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  #ui {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: #cce0ff; padding: 6px 13px; border-radius: 20px; font-size: 11px;
    cursor: pointer; backdrop-filter: blur(8px); transition: background 0.2s; letter-spacing: 0.04em;
  }
  .btn:hover { background: rgba(80,160,255,0.22); }
  .btn.active { background: rgba(80,160,255,0.35); border-color: #55aaff; }

  #info-panel {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(5,10,30,0.75); border: 1px solid rgba(80,160,255,0.3);
    border-radius: 12px; padding: 10px 20px; text-align: center;
    backdrop-filter: blur(10px); pointer-events: none;
    opacity: 0; transition: opacity 0.3s; min-width: 200px;
  }
  #info-panel.show { opacity: 1; }
  #info-name { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  #info-sub  { color: #88aadd; font-size: 11px; margin-top: 3px; }

  #zoom-hint {
    position: fixed; top: 16px; right: 16px; color: rgba(100,150,255,0.5);
    font-size: 10px; letter-spacing: 0.06em; text-align: right; pointer-events: none;
    line-height: 1.7;
  }

  #galaxy-label {
    position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%);
    color: rgba(150,180,255,0.4); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; pointer-events: none;
  }

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 80000);
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

camera.position.set(0, 80, 200);
camera.lookAt(0, 0, 0);
scene.background = new THREE.Color(0x000008);

// ═══════════════════════════════════════════════════════ GALAXY BACKGROUND ═══
// Milky Way band — procedural canvas texture
function makeGalaxyTexture() {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000008'; ctx.fillRect(0,0,W,H);

  // Galaxy band
  const band = ctx.createLinearGradient(0, H*0.3, 0, H*0.7);
  band.addColorStop(0,   'rgba(0,0,0,0)');
  band.addColorStop(0.3, 'rgba(40,50,120,0.18)');
  band.addColorStop(0.5, 'rgba(80,90,180,0.28)');
  band.addColorStop(0.7, 'rgba(40,50,120,0.18)');
  band.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = band; ctx.fillRect(0,0,W,H);

  // Nebula blobs
  [[W*0.2,H*0.5,200,'rgba(60,20,120,0.12)'],[W*0.6,H*0.48,300,'rgba(20,60,140,0.10)'],
   [W*0.8,H*0.52,180,'rgba(120,40,60,0.08)'],[W*0.4,H*0.46,250,'rgba(30,80,100,0.09)']
  ].forEach(([x,y,r,col]) => {
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  });

  // Stars
  for (let i = 0; i < 8000; i++) {
    const x = Math.random()*W, y = Math.random()*H;
    const inBand = Math.abs(y-H*0.5) < H*0.25;
    if (inBand && Math.random() > 0.4) continue;
    const sz = Math.random() < 0.05 ? Math.random()*2+1 : Math.random()*0.8+0.2;
    const bright = 0.4 + Math.random()*0.6;
    const hue = [0,120,220,280][Math.floor(Math.random()*4)];
    ctx.beginPath();
    ctx.arc(x,y,sz,0,Math.PI*2);
    ctx.fillStyle = `hsla(${hue},40%,${bright*100}%,${bright})`;
    ctx.fill();
  }
  // Dense band stars
  for (let i = 0; i < 4000; i++) {
    const x = Math.random()*W;
    const y = H*0.5 + (Math.random()-0.5)*H*0.5;
    const sz = Math.random()*0.6+0.1;
    ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2);
    ctx.fillStyle = `rgba(200,210,255,${Math.random()*0.6+0.1})`; ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

const galaxySphere = new THREE.Mesh(
  new THREE.SphereGeometry(40000, 64, 64),
  new THREE.MeshBasicMaterial({ map: makeGalaxyTexture(), side: THREE.BackSide })
);
scene.add(galaxySphere);

// Foreground star particles (closer stars)
const starGeo = new THREE.BufferGeometry();
const STARS = 8000;
const sp = new Float32Array(STARS*3), sc = new Float32Array(STARS*3), ss = new Float32Array(STARS);
for (let i = 0; i < STARS; i++) {
  const r = 500 + Math.random()*3000;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  sp[i*3]   = r*Math.sin(ph)*Math.cos(th);
  sp[i*3+1] = r*Math.sin(ph)*Math.sin(th);
  sp[i*3+2] = r*Math.cos(ph);
  const t = Math.random();
  sc[i*3]   = 0.7+t*0.3; sc[i*3+1] = 0.8+t*0.15; sc[i*3+2] = 1.0;
  ss[i] = Math.random() < 0.03 ? 2.5 : Math.random()*1.2+0.3;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
starGeo.setAttribute('color',    new THREE.BufferAttribute(sc,3));
starGeo.setAttribute('size',     new THREE.BufferAttribute(ss,1));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 0.8, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: false
})));

// ══════════════════════════════════════════════════════════════════ SUN ════════
// Procedural sun texture
function makeSunTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256,256,0,256,256,256);
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.2, '#fff5aa');
  g.addColorStop(0.5, '#ffcc00');
  g.addColorStop(0.8, '#ff8800');
  g.addColorStop(1,   '#ff3300');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
  // Sunspots
  for (let i = 0; i < 12; i++) {
    const x = 80+Math.random()*352, y = 100+Math.random()*312;
    const r = 5+Math.random()*18;
    const sg = ctx.createRadialGradient(x,y,0,x,y,r);
    sg.addColorStop(0,'rgba(80,30,0,0.6)'); sg.addColorStop(1,'rgba(80,30,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(0,0,512,512);
  }
  return new THREE.CanvasTexture(c);
}

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(12, 64, 64),
  new THREE.MeshBasicMaterial({ map: makeSunTexture() })
);
scene.add(sunMesh);

// Solar corona / glow layers
[16,22,30,42].forEach((r,i) => {
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(r,32,32),
    new THREE.MeshBasicMaterial({
      color: [0xffee88,0xffaa22,0xff6600,0xff2200][i],
      transparent: true, opacity: [0.15,0.07,0.04,0.02][i], side: THREE.BackSide, depthWrite: false
    })

});

// Solar flare particles
const flareGeo = new THREE.BufferGeometry();
const FP = 500; const fp = new Float32Array(FP*3);
for (let i = 0; i < FP; i++) {
  const a = Math.random()*Math.PI*2, b = Math.random()*Math.PI*2;
  const r = 12 + Math.random()*8;
  fp[i*3]   = r*Math.sin(b)*Math.cos(a);
  fp[i*3+1] = r*Math.sin(b)*Math.sin(a);
  fp[i*3+2] = r*Math.cos(b);
}
flareGeo.setAttribute('position', new THREE.BufferAttribute(fp,3));
const flarePts = new THREE.Points(flareGeo, new THREE.PointsMaterial({
  color:0xffaa22, size:0.4, transparent:true, opacity:0.6, sizeAttenuation:true

scene.add(flarePts);

const sunLight = new THREE.PointLight(0xfff5cc, 4, 2000);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x111133, 0.6));

// ══════════════════════════════════════════════════════════ PLANET FACTORY ════

function makeProceduralTexture(type, r,g,b, w=256, h=256) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w,h);

  function noise(x,y,scale=0.02) {
    // simple fbm-ish via sin/cos
    let v = 0;
    v += Math.sin(x*scale+1.2)*0.5 + Math.sin(y*scale*1.3+0.4)*0.5;
    v += Math.sin(x*scale*2.1+2.3)*0.25 + Math.sin(y*scale*2.4+1.1)*0.25;
    v += Math.sin(x*scale*4.3+0.7)*0.125 + Math.sin(y*scale*4.1+3.2)*0.125;
    return (v/1.75 + 1)/2;
  }

  for (let py=0; py<h; py++) {
    for (let px=0; px<w; px++) {
      const idx = (py*w+px)*4;
      const n = noise(px,py);

      if (type === 'earth') {
        const land = n > 0.52;
        const pole = py/h < 0.07 || py/h > 0.93;
        if (pole) { img.data[idx]=240; img.data[idx+1]=245; img.data[idx+2]=255; }
        else if (land) {
          const shade = 0.7+n*0.5;
          img.data[idx]=Math.min(255,40*shade); img.data[idx+1]=Math.min(255,(80+n*60)*shade); img.data[idx+2]=Math.min(255,30*shade);
        } else {
          const d = noise(px,py,0.015);
          img.data[idx]=Math.min(255,20+d*30); img.data[idx+1]=Math.min(255,60+d*80); img.data[idx+2]=Math.min(255,130+d*120);
        }
      } else if (type === 'mars') {
        const shade = 0.6+n*0.7;
        img.data[idx]=Math.min(255,(150+n*80)*shade);
        img.data[idx+1]=Math.min(255,(50+n*40)*shade);
        img.data[idx+2]=Math.min(255,(20+n*20)*shade);
        if (py/h < 0.1 || py/h > 0.9) { img.data[idx]=200; img.data[idx+1]=190; img.data[idx+2]=200; }
      } else if (type === 'moon') {
        const shade = 0.4+n*0.7;
        const v = Math.min(255,100*shade);
        img.data[idx]=v; img.data[idx+1]=v; img.data[idx+2]=v+10;
      } else if (type === 'mercury') {
        const shade = 0.3+n*0.8;
        const v = Math.min(255,110*shade);
        img.data[idx]=v; img.data[idx+1]=v-5; img.data[idx+2]=v-10;
      } else if (type === 'venus') {
        const shade = 0.6+n*0.6;
        img.data[idx]=Math.min(255,(210+n*30)*shade);
        img.data[idx+1]=Math.min(255,(170+n*40)*shade);
        img.data[idx+2]=Math.min(255,(80+n*30)*shade);
      } else if (type === 'jupiter') {
        // Banded
        const band = Math.sin(py/h*Math.PI*14 + n*2)*0.5+0.5;
        const t2 = noise(px,py,0.008);
        img.data[idx]=Math.min(255,160+band*70+t2*20);
        img.data[idx+1]=Math.min(255,110+band*50+t2*15);
        img.data[idx+2]=Math.min(255,60+band*30);
        // Great Red Spot
        const gx=w*0.6, gy=h*0.55;
        const dist = Math.sqrt((px-gx)**2+(py-gy)**2);
        if (dist<22) { img.data[idx]=200; img.data[idx+1]=60; img.data[idx+2]=40; }
      } else if (type === 'saturn') {
        const band = Math.sin(py/h*Math.PI*10 + n*1.5)*0.5+0.5;
        img.data[idx]=Math.min(255,200+band*40);
        img.data[idx+1]=Math.min(255,170+band*35);
        img.data[idx+2]=Math.min(255,110+band*20);
      } else if (type === 'uranus') {
        const shade = 0.7+n*0.4;
        img.data[idx]=Math.min(255,80*shade); img.data[idx+1]=Math.min(255,200*shade); img.data[idx+2]=Math.min(255,220*shade);
      } else if (type === 'neptune') {
        const shade = 0.6+n*0.5;
        img.data[idx]=Math.min(255,30*shade); img.data[idx+1]=Math.min(255,80*shade); img.data[idx+2]=Math.min(255,210*shade);
      } else {
        const shade = 0.5+n*0.8;
        img.data[idx]=Math.min(255,r*shade); img.data[idx+1]=Math.min(255,g*shade); img.data[idx+2]=Math.min(255,b*shade);
      }
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeOrbitRing(radius, color=0x334466, opacity=0.35) {
  const pts = [];
  for (let i=0; i<=256; i++) {
    const a = (i/256)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent:true, opacity }));
}

function makeSatellite() {
  const g = new THREE.Group();
  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.25,0.12,0.12),
    new THREE.MeshPhongMaterial({ color:0xccccdd, emissive:0x111122, shininess:80 })
  );
  g.add(body);
  // Solar panels
  const panelMat = new THREE.MeshPhongMaterial({ color:0x2244aa, emissive:0x001133, shininess:120 });
  [-0.35,0.35].forEach(x => {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.04,0.16), panelMat);
    panel.position.x = x; g.add(panel);
  });
  // Antenna
  const ant = new THREE.Mesh(
    new THREE.CylinderGeometry(0.008,0.008,0.22,6),
    new THREE.MeshPhongMaterial({ color:0xffffff })
  );
  ant.position.y = 0.16; ant.rotation.z = 0.3; g.add(ant);
  return g;
}

// ══════════════════════════════════════════════════ BUILD SOLAR SYSTEM ════════
let speedMult = 1, orbitsVisible = true, moonOrbitsVisible = true;
const planets = [], allOrbitLines = [], allMoonOrbitLines = [];
const infoPanel = document.getElementById('info-panel');
const infoName  = document.getElementById('info-name');
const infoSub   = document.getElementById('info-sub');
let infoClear;

// Sun is draggable in galaxy
let sunDragging = false, sunPos = new THREE.Vector3(0,0,0);
let sunDragTarget = new THREE.Vector3(0,0,0);
const galaxyPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

function showInfo(name, sub) {
  infoName.textContent = name; infoSub.textContent = sub;
  infoPanel.classList.add('show');
  clearTimeout(infoClear); infoClear = setTimeout(() => infoPanel.classList.remove('show'), 3000);
}

function buildPlanet(data) {
  const pivot = new THREE.Group(); // orbits around sun (which can move)
  scene.add(pivot);

  // Orbit line (around sun position)
  const orb = makeOrbitRing(data.orbit);
  scene.add(orb); allOrbitLines.push(orb);

  // Planet group (handles tilt)
  const group = new THREE.Group();
  pivot.add(group);

  // Planet texture
  const tex = makeProceduralTexture(data.tex, 150,150,150, 512, 256);
  const mat = new THREE.MeshPhongMaterial({
    map: tex, shininess: data.name==='Earth'?80:25,
    specular: data.name==='Earth'?0x225588:0x050505,
    emissive: new THREE.Color(0x050505)
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius,64,64), mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  group.add(mesh);
  mesh.userData = { planet: data };

  // Atmosphere for Earth/Venus/Uranus/Neptune
  if (['Earth','Venus','Uranus','Neptune'].includes(data.name)) {
    const atmColors = { Earth:'rgba(80,160,255,0.12)', Venus:'rgba(255,180,50,0.10)', Uranus:'rgba(80,220,240,0.10)', Neptune:'rgba(40,80,255,0.10)' };
    const atmGeo = new THREE.SphereGeometry(data.radius*1.06,32,32);
    const atmMat = new THREE.MeshPhongMaterial({
      color: data.name==='Earth'?0x4499ff:data.name==='Venus'?0xffaa33:0x44ddee,
      transparent:true, opacity:0.12, side:THREE.FrontSide, depthWrite:false
    });
    group.add(new THREE.Mesh(atmGeo, atmMat));
  }

  // Earth cloud layer
  let clouds = null;
  if (data.name === 'Earth') {
    const cloudCanvas = document.createElement('canvas'); cloudCanvas.width=512; cloudCanvas.height=256;
    const cctx = cloudCanvas.getContext('2d');
    for (let i=0;i<600;i++) {
      const x=Math.random()*512, y=Math.random()*256, w=20+Math.random()*60, h=5+Math.random()*20;
      const cg = cctx.createRadialGradient(x,y,0,x,y,w);
      cg.addColorStop(0,'rgba(255,255,255,0.35)'); cg.addColorStop(1,'rgba(255,255,255,0)');
      cctx.fillStyle=cg; cctx.fillRect(0,0,512,256);
    }
    clouds = new THREE.Mesh(
      new THREE.SphereGeometry(data.radius*1.03,48,48),
      new THREE.MeshPhongMaterial({ map:new THREE.CanvasTexture(cloudCanvas), transparent:true, opacity:0.8, depthWrite:false })
    );
    group.add(clouds);
  }

  // Saturn/Uranus rings
  let ringMesh = null;
  if (data.rings) {
    const inner = data.ringInner ? data.radius*data.ringInner : data.radius*1.3;
    const outer = data.ringOuter ? data.radius*data.ringOuter : data.radius*2.5;

    // Procedural ring texture
    const rCanvas = document.createElement('canvas'); rCanvas.width=512; rCanvas.height=1;
    const rctx = rCanvas.getContext('2d');
    const rg = rctx.createLinearGradient(0,0,512,0);
    if (data.name==='Saturn') {
      rg.addColorStop(0,'rgba(0,0,0,0)');
      rg.addColorStop(0.05,'rgba(200,185,140,0.5)');
      rg.addColorStop(0.2,'rgba(230,210,160,0.85)');
      rg.addColorStop(0.4,'rgba(180,160,120,0.6)');
      rg.addColorStop(0.55,'rgba(240,220,170,0.9)');
      rg.addColorStop(0.7,'rgba(160,140,100,0.5)');
      rg.addColorStop(0.85,'rgba(200,185,140,0.35)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
    } else {
      rg.addColorStop(0,'rgba(0,0,0,0)');
      rg.addColorStop(0.3,'rgba(100,160,180,0.25)');
      rg.addColorStop(0.6,'rgba(120,180,200,0.35)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
    }
    rctx.fillStyle = rg; rctx.fillRect(0,0,512,1);

    const ringGeo = new THREE.RingGeometry(inner, outer, 256);
    const uvAttr = ringGeo.attributes.uv;
    const posAttr = ringGeo.attributes.position;
    for (let i=0; i<posAttr.count; i++) {
      const v = new THREE.Vector3().fromBufferAttribute(posAttr,i);
      uvAttr.setXY(i, (v.length()-inner)/(outer-inner), 0);
    }
    ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(rCanvas), side:THREE.DoubleSide, transparent:true, depthWrite:false
    }));
    ringMesh.rotation.x = Math.PI/2;
    group.add(ringMesh);
  }

  // Tilt group
  group.rotation.z = (data.tilt*Math.PI)/180;

  // Moons
  const moonObjs = [];
  const moonPivots = [];
  if (data.moons) {
    data.moons.forEach(md => {
      const moonPivot = new THREE.Group();
      group.add(moonPivot);
      moonPivots.push(moonPivot);

      // Moon orbit ring
      const mOrb = makeOrbitRing(md.dist, 0x445566, 0.28);
      group.add(mOrb); allMoonOrbitLines.push(mOrb);

      // Tilt the moon orbit plane
      moonPivot.rotation.x = (md.tilt||0)*Math.PI/180;
      if (md.retrograde) moonPivot.rotation.z = Math.PI;

      const moonTex = makeProceduralTexture('moon',120,120,120,256,128);
      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(md.radius,32,32),
        new THREE.MeshPhongMaterial({ map:moonTex, shininess:10, emissive:0x050505 })
      );
      moonMesh.position.set(md.dist,0,0);
      moonMesh.castShadow = true;
      moonMesh.userData = { moon: md };
      moonPivot.add(moonMesh);
      moonObjs.push({ pivot:moonPivot, mesh:moonMesh, data:md, angle:Math.random()*Math.PI*2 });
    });
  }

  // Satellites (Earth)
  const satObjs = [];
  if (data.satellites) {
    data.satellites.forEach(sd => {
      const satPivot = new THREE.Group();
      group.add(satPivot);
      satPivot.rotation.x = sd.inclination;
      satPivot.rotation.z = Math.random()*Math.PI*2;

      // Orbit ring for satellite
      const sOrb = makeOrbitRing(sd.dist, 0x4488aa, 0.4);
      group.add(sOrb); allMoonOrbitLines.push(sOrb);

      const sat = makeSatellite();
      sat.scale.setScalar(sd.scale||0.5);
      sat.position.set(sd.dist,0,0);
      satPivot.add(sat);
      satObjs.push({ pivot:satPivot, sat, data:sd, angle:Math.random()*Math.PI*2 });
    });
  }

  return {
    pivot, group, mesh, clouds, ringMesh, data,
    angle: Math.random()*Math.PI*2, selfRot:0,
    moonObjs, satObjs
  };
}

planetData.forEach(d => planets.push(buildPlanet(d)));

// ═══════════════════════════════════════════════════ CAMERA & INTERACTION ══════
let isDragging = false;
let isSunDrag  = false;
let prevMouse  = { x:0, y:0 };
let camTheta = 0.4, camPhi = 1.0, camRadius = 240;
let camTarget = new THREE.Vector3(0,0,0); // follows sun
let targetCamRadius = camRadius;

// Smooth zoom
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  targetCamRadius = Math.max(12, Math.min(900, targetCamRadius + e.deltaY * 0.25));
}, { passive:false });

// Pinch zoom
let lastPinchDist = null;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  } else if (e.touches.length === 1) {
    prevMouse = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    isDragging = true;
  }
});
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && lastPinchDist) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    targetCamRadius *= lastPinchDist / d;
    targetCamRadius = Math.max(12, Math.min(900, targetCamRadius));
    lastPinchDist = d;
  } else if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    camTheta -= dx * 0.004;
    camPhi    = Math.max(0.05, Math.min(Math.PI*0.9, camPhi + dy*0.004));
    prevMouse = { x:e.touches[0].clientX, y:e.touches[0].clientY };
  }
}, { passive:false });
renderer.domElement.addEventListener('touchend', e => {
  if (e.touches.length < 2) lastPinchDist = null;
  if (e.touches.length === 0) isDragging = false;
});

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  prevMouse = { x:e.clientX, y:e.clientY };
});
renderer.domElement.addEventListener('mouseup', () => { isDragging = false; isSunDrag = false; });
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  camTheta -= dx * 0.004;
  camPhi    = Math.max(0.05, Math.min(Math.PI*0.9, camPhi + dy*0.004));
  prevMouse = { x:e.clientX, y:e.clientY };
});

// Click for info + sun drag detection
const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  mouse2.x = (e.clientX/innerWidth)*2-1;
  mouse2.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse2, camera);

  // Check sun
  const sunHit = raycaster.intersectObject(sunMesh);
  if (sunHit.length) { showInfo('☀ The Sun', 'G-type star · 1.4M km diameter · Drag me!'); return; }

  // Check planets
  const meshes = planets.map(p=>p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length) {
    const p = planets.find(p=>p.mesh===hits[0].object);
    if (p) showInfo(p.data.name, p.data.info||'');
    return;
  }

  // Check moons
  for (const p of planets) {
    for (const m of p.moonObjs) {
      const mhit = raycaster.intersectObject(m.mesh);
      if (mhit.length) { showInfo(m.data.name, `Moon of ${p.data.name}`); return; }
    }
  }
});

// Sun drag — right-click drag or Ctrl+drag moves the sun through galaxy
let sunDragActive = false;
let sunDragPlaneY = 0;
renderer.domElement.addEventListener('contextmenu', e => {
  e.preventDefault();
  sunDragActive = !sunDragActive;
  showInfo('Sun Drag ' + (sunDragActive?'ON':'OFF'), sunDragActive ? 'Left-drag to move sun through galaxy' : 'Sun anchored');
});

// ═════════════════════════════════════════════ UI HELPERS ══════════════════════
function setSpeed(s) {
  speedMult = s;
  ['1x','3x','10x'].forEach(id => document.getElementById('b'+id.replace('x','')+'x') && null);
  document.getElementById('b1x').classList.toggle('active', s===1);
  document.getElementById('b3x').classList.toggle('active', s===3);
  document.getElementById('b10x').classList.toggle('active', s===10);
}
function toggleOrbits() {
  orbitsVisible = !orbitsVisible;
  allOrbitLines.forEach(l => l.visible = orbitsVisible);
}
function toggleMoonOrbits() {
  moonOrbitsVisible = !moonOrbitsVisible;
  allMoonOrbitLines.forEach(l => l.visible = moonOrbitsVisible);
}
function resetCamera() { camTheta=0.4; camPhi=1.0; targetCamRadius=240; sunDragActive=false; }
function focusSun() {
  camTheta=0.4; camPhi=0.8; targetCamRadius=60;
  showInfo('☀ The Sun', 'Our star — G-type main sequence');
}

// ══════════════════════════════════════════════════════════ ANIMATE ════════════
const clock = new THREE.Clock();
let sunTime = 0;
let sunGalaxyAngle = 0;
let sunGalaxyR = 0; // how far sun has drifted
const sunMoveSpeed = 0.003;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05) * speedMult;
  sunTime += dt;

  // ── Sun drift through galaxy (when drag active, controlled by mouse; else auto-drift gently)
  if (sunDragActive && isDragging) {
    // Move sun in the direction of mouse drag (horizontal plane)
    const dx = prevMouse.x - innerWidth/2;
    const dz = prevMouse.y - innerHeight/2;
    sunDragTarget.x += dx * 0.002 * dt * 60;
    sunDragTarget.z += dz * 0.002 * dt * 60;
    sunDragTarget.x = Math.max(-800, Math.min(800, sunDragTarget.x));
    sunDragTarget.z = Math.max(-800, Math.min(800, sunDragTarget.z));
  } else if (!sunDragActive) {
    // Auto gentle galactic drift
    sunGalaxyAngle += 0.00008 * speedMult;
    sunDragTarget.x = Math.sin(sunGalaxyAngle)*0.3;
    sunDragTarget.z = Math.cos(sunGalaxyAngle)*0.3;
  }
  sunPos.lerp(sunDragTarget, 0.04);
  sunMesh.position.copy(sunPos);
  sunLight.position.copy(sunPos);
  flarePts.position.copy(sunPos);
  camTarget.lerp(sunPos, 0.05);

  // Sun rotation + corona pulse
  sunMesh.rotation.y += 0.003 * dt * 60;
  flarePts.rotation.y += 0.005 * dt * 60;
  const pulse = Math.sin(sunTime*1.5)*0.04;
  flarePts.material.opacity = 0.55 + pulse;

  // Update all orbit ring positions to follow sun
  allOrbitLines.forEach(l => { l.position.copy(sunPos); });

  // ── Planets
  planets.forEach(p => {
    const { pivot, group, mesh, clouds, data, moonObjs, satObjs } = p;

    // Orbit around sun
    p.angle += data.speed * 0.003 * dt;
    const ox = sunPos.x + Math.cos(p.angle) * data.orbit;
    const oz = sunPos.z + Math.sin(p.angle) * data.orbit;
    pivot.position.set(ox, sunPos.y, oz);

    // Self rotation
    p.selfRot += 0.35 * dt;
    mesh.rotation.y = p.selfRot;
    if (clouds) clouds.rotation.y = p.selfRot * 1.12;

    // Moons orbiting planet
    moonObjs.forEach(m => {
      const dir = m.data.retrograde ? -1 : 1;
      m.angle += m.data.speed * 0.012 * dt * dir;
      m.pivot.rotation.y = m.angle;
      m.mesh.rotation.y += 0.2 * dt; // moon self-rotation
    });

    // Satellites orbiting Earth
    satObjs.forEach(s => {
      s.angle += s.data.speed * 0.04 * dt;
      s.pivot.rotation.y = s.angle;
      // Satellite always faces direction of travel
      s.sat.rotation.y += 0.5 * dt;
    });
  });

  // ── Smooth zoom
  camRadius += (targetCamRadius - camRadius) * 0.08;

  // ── Camera position (orbits camTarget)
  camera.position.set(
    camTarget.x + Math.sin(camTheta)*Math.sin(camPhi)*camRadius,
    camTarget.y + Math.cos(camPhi)*camRadius,
    camTarget.z + Math.cos(camTheta)*Math.sin(camPhi)*camRadius
  );
  camera.lookAt(camTarget);

  // Galaxy sphere follows camera center loosely
  galaxySphere.position.copy(camera.position);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
